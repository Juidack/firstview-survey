<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Webページ・ファーストビュー調査</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;color:#111;font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif}
body{overflow:hidden}
button{font:inherit}
.app{width:100%;height:100dvh;min-height:520px;display:grid;grid-template-rows:42px 1fr;overflow:hidden}
.header{display:flex;align-items:center;justify-content:flex-end;padding:0 18px}
.progress{font-size:14px;color:#666}
.screen{position:relative;min-width:0;min-height:0;overflow:hidden;display:grid;place-items:center;padding:12px}
.card{width:min(760px,94vw);max-height:calc(100dvh - 66px);overflow:auto;border:1px solid #ddd;border-radius:14px;padding:32px;background:#fff;box-shadow:0 5px 24px rgba(0,0,0,.06)}
h1{font-size:28px;line-height:1.4;margin:0 0 18px}
h2{font-size:22px;line-height:1.5;margin:0 0 14px}
p{line-height:1.8;margin:8px 0}
.note,.small{font-size:14px;color:#666}
.start,.next{border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}
.start{margin-top:24px;padding:13px 28px}
.grade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.grade-btn,.scale-btn{border:1px solid #ccc;background:#fff;border-radius:8px;cursor:pointer}
.grade-btn{padding:13px}
.grade-btn.selected,.scale-btn.selected{border-color:#111;background:#111;color:#fff}
.next{width:100%;padding:13px;margin-top:16px}
.next:disabled{background:#ccc;cursor:not-allowed}
.error{color:#b00020;background:#fff1f2;border:1px solid #f0b8bf;padding:12px;border-radius:8px;margin-top:12px}
.loading{display:grid;place-items:center;color:#666;font-size:15px}

/* 回答画面：画像を大きくしすぎず、縦横比を保持して全体を表示 */
.survey-page{position:relative;width:100%;height:100%;min-width:0;min-height:0}
.visual-wrap{
  position:absolute;inset:0;
  padding:18px 24px 178px;
  display:grid;place-items:center;
  overflow:hidden;
}
.stimulus{
  display:block;width:auto;height:auto;
  max-width:min(1200px,calc(100vw - 48px));
  max-height:calc(100dvh - 250px);
  object-fit:contain;object-position:center;
  user-select:none;-webkit-user-drag:none;
}
.image-loading{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.92);
  color:#666;font-size:14px;pointer-events:none
}
.footer{
  position:fixed;left:0;right:0;bottom:0;z-index:50;width:100%;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);border-top:1px solid #e5e5e5
}
.controls{width:min(920px,100%);margin:0 auto}
.question{text-align:center;font-size:20px;font-weight:600;margin:0 0 9px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale-btn{min-width:0;padding:10px 5px;font-size:14px}
.scale-btn:disabled{cursor:not-allowed;opacity:.55}
.next-survey{width:100%;margin-top:9px;padding:10px}
.submit-state{text-align:center;font-size:14px;color:#666;padding:10px}
@media(max-width:700px){
  .app{grid-template-rows:36px 1fr}
  .header{padding:0 10px}
  .card{padding:24px;max-height:calc(100dvh - 48px)}
  .visual-wrap{padding:12px 10px 270px}
  .stimulus{max-width:calc(100vw - 20px);max-height:calc(100dvh - 300px)}
  .footer{padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
  .question{font-size:18px;margin-bottom:6px}
  .scale{grid-template-columns:1fr;gap:5px}
  .scale-btn{padding:8px 5px}
  .next-survey{margin-top:7px;padding:9px}
}
</style>
</head>
<body>
<div class="app">
  <header class="header"><div id="progress" class="progress"></div></header>
  <main id="screen" class="screen"></main>
</div>

<script>
'use strict';

const IMAGE_BASE_URL = './images';
const GAS_ENDPOINT = 'https://script.google.com/a/macros/ss.p.u-tokyo.ac.jp/s/AKfycbxqVtEFZyrG-FJaHarc8O1_5Oxwq9lGU5IWk_qze-puXXTVgSfwByrBdJ1SQQ1O3cOI/exec';

const PAGES = [
  {group:0,file:'01_kokuyo.webp'},
  {group:0,file:'02_asics.webp'},
  {group:0,file:'03_jrtokai.webp'},
  {group:0,file:'04_fastretailing.webp'},
  {group:0,file:'05_suntory.webp'},
  {group:1,file:'06_taiseikai.webp'},
  {group:1,file:'07_sky.webp'},
  {group:1,file:'08_desknet.webp'},
  {group:1,file:'09_nisa.webp'},
  {group:1,file:'10_env.webp'},
  {group:2,file:'11_suido.webp'},
  {group:2,file:'12_osoujihonpo.webp'},
  {group:2,file:'13_kagome.webp'},
  {group:2,file:'14_orangepage.webp'},
  {group:2,file:'15_taisho.webp'}
];

const GROUPS = [
  {title:'企業のWebサイト',range:'1〜5',text:'ある企業について知るために、その企業のWebサイトを見ている場面を想像してください。'},
  {title:'用語・概念を調べるページ',range:'6〜10',text:'ある言葉や概念について意味を調べるために、Webページを見ている場面を想像してください。'},
  {title:'方法・対処法を調べるページ',range:'11〜15',text:'あることの方法や対処法を調べるために、Webページを見ている場面を想像してください。'}
];

const state={grade:'',answers:Array(15).fill(''),page:0,responseId:makeId(),submitting:false,imageCache:new Map()};

function makeId(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return 'r-'+Date.now()+'-'+Math.random().toString(36).slice(2);
}
function imageUrl(file){return IMAGE_BASE_URL.replace(/\/+$/,'')+'/'+encodeURIComponent(file)}
function setProgress(text){document.getElementById('progress').textContent=text||''}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showError(message){
  document.getElementById('screen').innerHTML='<section class="card"><h2>エラーが発生しました</h2><p class="error">'+escapeHtml(message)+'</p><p class="note">ページを再読み込みして、もう一度お試しください。</p></section>';
}

function renderStart(){
  setProgress('');
  document.getElementById('screen').innerHTML=
    '<section class="card">'+
      '<h1>Webページ・ファーストビュー調査</h1>'+
      '<p>このアンケートでは、Webページを最初に見たときに、そのページをさらに見たいと思うかについて回答していただきます。</p>'+
      '<p>回答は卒業研究の分析に使用します。回答は匿名で記録され、氏名・メールアドレス・学籍番号など、個人を特定する情報は収集しません。回答は任意です。</p>'+
      '<p>アンケート中は、実際にWebページを見るときに近い状態で回答していただくため、全画面表示を使用します。</p>'+
      '<p class="note">全画面表示はブラウザの仕様により、開始ボタンを押した後に開始されます。Escキーなどで解除された場合は、そのまま回答を続けてください。</p>'+
      '<button class="start" type="button" id="startBtn">調査を始める</button>'+
    '</section>';
  document.getElementById('startBtn').addEventListener('click',renderGrade);
}

function renderGrade(){
  setProgress('');
  const buttons=Array.from({length:6},(_,i)=>'<button type="button" class="grade-btn" data-grade="'+(i+1)+'">'+(i+1)+'年生</button>').join('');
  document.getElementById('screen').innerHTML=
    '<section class="card">'+
      '<h2>あなたの学年を教えてください。</h2>'+
      '<div class="grade-grid">'+buttons+'</div>'+
      '<button type="button" class="next" id="gradeNext" disabled>次へ</button>'+
    '</section>';
  document.querySelectorAll('.grade-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.grade-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      state.grade=btn.dataset.grade;
      document.getElementById('gradeNext').disabled=false;
    });
  });
  document.getElementById('gradeNext').addEventListener('click',()=>{
    if(state.grade) renderGroup(0);
  });
}

function renderGroup(g){
  const group=GROUPS[g];
  setProgress('');
  document.getElementById('screen').innerHTML=
    '<section class="card">'+
      '<h2>'+escapeHtml(group.title)+'</h2>'+
      '<p>'+escapeHtml(group.text)+'</p>'+
      '<p class="note">これから '+escapeHtml(group.range)+' の5ページを回答します。</p>'+
      '<p class="note">各ページを最初に見たとき、「このページをさらに見たいと思いますか？」に5段階で回答してください。</p>'+
      '<button type="button" class="start" id="groupNext">次へ</button>'+
    '</section>';
  document.getElementById('groupNext').addEventListener('click',()=>renderPage(g*5));
}

function loadImage(index){
  if(state.imageCache.has(index))return state.imageCache.get(index);
  const p=new Promise((resolve,reject)=>{
    const img=new Image();
    img.decoding='async';
    if(index===0)img.fetchPriority='high';
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error('画像を読み込めませんでした: '+PAGES[index].file));
    img.src=imageUrl(PAGES[index].file);
  });
  state.imageCache.set(index,p);
  return p;
}
function preloadAround(index){
  [index+1,index+2].filter(i=>i<PAGES.length).forEach(i=>loadImage(i).catch(()=>{}));
}

async function renderPage(index){
  state.page=index;
  setProgress((index+1)+' / '+PAGES.length);
  document.getElementById('screen').innerHTML=
    '<section class="survey-page">'+
      '<div class="visual-wrap">'+
        '<div class="image-loading" id="imageLoading">画像を読み込んでいます…</div>'+
        '<img id="stimulus" class="stimulus" alt="" draggable="false">'+
      '</div>'+
      '<div class="footer">'+
        '<div class="controls">'+
          '<div class="question">このページをさらに見たいと思いますか？</div>'+
          '<div class="scale" id="scale">'+
            '<button type="button" class="scale-btn" data-value="1">1：まったく思わない</button>'+
            '<button type="button" class="scale-btn" data-value="2">2：あまり思わない</button>'+
            '<button type="button" class="scale-btn" data-value="3">3：どちらともいえない</button>'+
            '<button type="button" class="scale-btn" data-value="4">4：やや思う</button>'+
            '<button type="button" class="scale-btn" data-value="5">5：非常に思う</button>'+
          '</div>'+
          '<button type="button" class="next next-survey" id="pageNext" disabled>次へ</button>'+
        '</div>'+
      '</div>'+
    '</section>';

  const imgEl=document.getElementById('stimulus');
  const loading=document.getElementById('imageLoading');
  const buttons=Array.from(document.querySelectorAll('.scale-btn'));
  const next=document.getElementById('pageNext');

  buttons.forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.disabled)return;
      state.answers[index]=btn.dataset.value;
      buttons.forEach(b=>b.classList.toggle('selected',b===btn));
      next.disabled=false;
    });
  });
  next.addEventListener('click',()=>{
    if(!state.answers[index])return;
    if(index===4){renderGroup(1);return}
    if(index===9){renderGroup(2);return}
    if(index===14){renderConfirm();return}
    renderPage(index+1);
  });

  try{
    const img=await loadImage(index);
    imgEl.src=img.src;
    imgEl.alt='調査対象ページのファーストビュー';
    if(img.decode){try{await img.decode()}catch(e){}}
    loading.remove();
    buttons.forEach(b=>b.disabled=false);
    preloadAround(index);
  }catch(err){
    loading.textContent='画像の読み込みに失敗しました。';
    showError(err.message);
  }
}

function renderConfirm(){
  setProgress('15 / 15');
  document.getElementById('screen').innerHTML=
    '<section class="card">'+
      '<h2>回答を送信します</h2>'+
      '<p>15ページすべてに回答しました。回答内容を確認したら、送信してください。</p>'+
      '<button type="button" class="next" id="submitBtn">回答を送信する</button>'+
      '<p id="submitMessage" class="note"></p>'+
    '</section>';
  document.getElementById('submitBtn').addEventListener('click',submit);
}

function submit(){
  if(state.submitting)return;
  if(!state.grade||state.answers.some(v=>!v)){showError('回答が不足しています。');return}
  state.submitting=true;
  const btn=document.getElementById('submitBtn');
  const msg=document.getElementById('submitMessage');
  btn.disabled=true;btn.textContent='送信中…';msg.textContent='回答を保存しています。';

  const payload=new URLSearchParams({
    grade:state.grade,
    answers:JSON.stringify(state.answers),
    responseId:state.responseId
  });

  fetch(GAS_ENDPOINT,{
    method:'POST',
    mode:'no-cors',
    credentials:'include',
    body:payload,
    keepalive:true
  }).then(()=>{
    setProgress('');
    document.getElementById('screen').innerHTML='<section class="card"><h1>回答ありがとうございました。</h1><p>回答を送信しました。</p></section>';
  }).catch(err=>{
    state.submitting=false;
    btn.disabled=false;btn.textContent='回答を送信する';
    msg.textContent='送信に失敗しました。通信環境を確認して、もう一度お試しください。';
    console.error(err);
  });
}

renderStart();
</script>
</body>
</html>
